name: keep-alive

# Supabase free projects pause after about 7 days without activity, which takes
# the whole app down (reports, tracking and staff login all need the database).
# Loading the public report page makes the server read from the database, so
# this counts as activity, and it fails loudly if the database stops answering.

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Load the report page and confirm buildings come from the database
        run: |
          set -euo pipefail
          url="https://ai-tool-fix.vercel.app/report"
          # หน้าแจ้งซ่อมพาไปหน้าเข้าสู่ระบบก่อนถ้ายังไม่เลือกประเภทผู้ใช้ และไม่แตะฐานข้อมูลเลย
          # จึงส่งคุกกี้ "บุคคลภายนอก" ไปด้วยเพื่อให้หน้าโหลดรายชื่อหน่วยงานจากฐานข้อมูลจริง
          reporter='reporter=%7B%22type%22%3A%22external%22%7D'

          for attempt in 1 2 3; do
            code=$(curl -sS -m 40 -b "$reporter" -o page.html -w "%{http_code}" "$url" || echo 000)
            echo "attempt $attempt: HTTP $code"

            # An empty database (paused or unreachable) still renders the page with
            # an empty buildings list, so a 200 alone proves nothing.
            if [ "$code" = "200" ] && grep -Eq 'buildings[^[]{1,4}\[\{' page.html; then
              echo "database answered: unit list is populated"
              exit 0
            fi
            sleep 20
          done

          echo "::error::Database did not answer. The Supabase project is probably paused: open the dashboard and press Restore project."
          exit 1
